[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ptguard"
version = "0.1.0"
description = "Code and page-level benchmark of 'Passing the Benchmark, Failing the README' (pt-BR prompt-injection classifier)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Rodrigo Faria" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: Portuguese (Brazilian)",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# treino, tradução e avaliação por frase (bases do Hugging Face, Opus-MT, e5)
train = ["torch>=2.1", "transformers>=4.56", "datasets>=3.0", "huggingface_hub>=0.25", "sentencepiece", "kaggle"]
# benchmark por página e baselines (o construtor em si só precisa da biblioteca padrão + datasets)
bench = ["torch>=2.1", "transformers>=4.56", "datasets>=3.0", "huggingface_hub>=0.25"]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/alucardigo/passing-the-benchmark"

[tool.setuptools]
packages = ["ptguard"]

[tool.setuptools.package-data]
ptguard = ["revisoes.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
